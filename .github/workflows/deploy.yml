name: Build and Deploy (develop only)

on:
  push:
    branches:
      - 'dev/**'          # tylko branże developerskie
      - 'master'
  workflow_dispatch: {}   # opcjonalne ręczne odpalanie (również deploy na dev)

jobs:
  build:
    runs-on: ubuntu-latest
    environment: development
    env:
      IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/projektZespolowy.splitPayment.frontend
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:dev
            ${{ env.IMAGE_REPO }}:dev-${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ github.run_number }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache,mode=max

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: development
      url: https://url_amazon/apka
    steps:
      - name: Deploy to Development VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST_SR01A }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -Eeuo pipefail

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/projektZespolowy.splitPayment.frontend:dev"
            APP_NAME="ProjektZespolowy.SplitPayment.Frontend-dev"
            NET_NAME="app-network"

            log() { echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] $*"; }

            ensure_network() {
              if ! docker network inspect "${NET_NAME}" >/dev/null 2>&1; then
                log "Network '${NET_NAME}' not found. Creating..."
                docker network create "${NET_NAME}"
              else
                log "Network '${NET_NAME}' exists."
              fi
            }

            container_running() { docker ps -q -f name="^/${APP_NAME}$" | grep -q .; }
            container_exists()  { docker ps -aq -f name="^/${APP_NAME}$" | grep -q .; }

            stop_container_safe() {
              if container_running; then
                log "Stopping running container '${APP_NAME}'..."
                docker stop "${APP_NAME}" >/dev/null
              else
                log "No running container '${APP_NAME}' to stop."
              fi
            }

            remove_container_safe() {
              if container_exists; then
                log "Removing existing container '${APP_NAME}'..."
                docker rm "${APP_NAME}" >/dev/null
              else
                log "No existing container '${APP_NAME}' to remove."
              fi
            }

            ensure_network
            log "Pulling image ${IMAGE}..."
            docker pull "${IMAGE}"

            stop_container_safe
            remove_container_safe

            log "Starting new container '${APP_NAME}' (base path: '${BASE_PATH:-<empty>}')..."
            docker run -d \
              --name "${APP_NAME}" \
              --network "${NET_NAME}" \
              --restart unless-stopped \
              -e NODE_ENV=development \
              -e PORT=3000 \
              "${IMAGE}"

            log "Waiting for container to stabilize..."
            sleep 10

            if container_running; then
              log "Container '${APP_NAME}' is running."
            else
              log "ERROR: Container '${APP_NAME}' failed to start."
              docker logs "${APP_NAME}" || true
              exit 1
            fi

            log "Pruning dangling images..."
            docker image prune -f >/dev/null || true

            log "Development deployment successful!"
