name: build-and-deploy

on:
  push:
    branches: [ master, "dev/**" ]
  workflow_dispatch:

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repo na Docker Hub
  DOCKER_REPOSITORY: mehdev66/projektzespolowy.splitpayment
  # Środowisko builda
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_repo: ${{ steps.meta.outputs.image_repo }}
      full_tag_sha: ${{ steps.meta.outputs.full_tag_sha }}
      full_tag_latest: ${{ steps.meta.outputs.full_tag_latest }}
      digest: ${{ steps.build_push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (for potential prebuilds – optional)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          IMAGE_REPO="${DOCKER_REPOSITORY}"
          SHORT_SHA="${GITHUB_SHA::12}"

          # branch slug (bez ukośników)
          REF_NAME="${GITHUB_REF_NAME}"
          BRANCH_SLUG="$(echo "$REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')"

          if [ "$REF_NAME" = "master" ]; then
            LATEST_TAG="latest"
          else
            LATEST_TAG="dev-${BRANCH_SLUG}"
          fi

          FULL_TAG_SHA="${IMAGE_REPO}:${SHORT_SHA}"
          FULL_TAG_LATEST="${IMAGE_REPO}:${LATEST_TAG}"

          {
            echo "image_repo=${IMAGE_REPO}"
            echo "short_sha=${SHORT_SHA}"
            echo "branch_slug=${BRANCH_SLUG}"
            echo "latest_tag=${LATEST_TAG}"
            echo "full_tag_sha=${FULL_TAG_SHA}"
            echo "full_tag_latest=${FULL_TAG_LATEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push (standalone / Next.js)
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # dwa tagi: immutable po SHA i ruchomy "latest/dev-branch"
          tags: |
            ${{ steps.meta.outputs.full_tag_sha }}
            ${{ steps.meta.outputs.full_tag_latest }}
          # digest będzie dostępny w outputs jako steps.build_push.outputs.digest
          provenance: false

      - name: Summary
        run: |
          echo "Repo:         ${{ steps.meta.outputs.image_repo }}"
          echo "Tag (SHA):    ${{ steps.meta.outputs.full_tag_sha }}"
          echo "Tag (latest): ${{ steps.meta.outputs.full_tag_latest }}"
          echo "Digest:       ${{ steps.build_push.outputs.digest }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy over SSH (immutable by digest, fallback to tag)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -Eeuo pipefail

            # -------- Config (from build outputs) --------
            IMAGE_REPO="${{ needs.build.outputs.image_repo }}"
            DIGEST="${{ needs.build.outputs.digest }}"
            IMAGE_BY_DIGEST="${IMAGE_REPO}@${DIGEST}"
            IMAGE_BY_TAG="${{ needs.build.outputs.full_tag_sha }}"

            APP_NAME="ProjektZespolowy.SplitPayment.Frontend"
            NET_NAME="app-network"
            EXPOSE_PORT="3000"

            log() { echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] $*"; }
            container_running() { docker ps -q -f name="^/${APP_NAME}$" | grep -q .; }
            container_exists()  { docker ps -aq -f name="^/${APP_NAME}$" | grep -q .; }

            ensure_network() {
              if ! docker network inspect "${NET_NAME}" >/dev/null 2>&1; then
                log "Network '${NET_NAME}' not found. Creating..."
                docker network create "${NET_NAME}"
              else
                log "Network '${NET_NAME}' exists."
              fi
            }

            stop_container_safe() {
              if container_running; then
                log "Stopping running container '${APP_NAME}'..."
                docker stop "${APP_NAME}" >/dev/null
              else
                log "No running container '${APP_NAME}' to stop."
              fi
            }

            remove_container_safe() {
              if container_exists; then
                log "Removing existing container '${APP_NAME}'..."
                docker rm "${APP_NAME}" >/dev/null
              else
                log "No existing container '${APP_NAME}' to remove."
              fi
            }

            pull_or_fallback() {
              local primary="$1"
              local fallback="$2"

              log "Pulling image (by digest): ${primary}"
              if docker pull "${primary}"; then
                echo "${primary}"
                return 0
              fi

              log "WARN: Pull by digest failed. Falling back to tag: ${fallback}"
              docker pull "${fallback}"
              echo "${fallback}"
            }

            ensure_network
            CHOSEN_IMAGE="$(pull_or_fallback "${IMAGE_BY_DIGEST}" "${IMAGE_BY_TAG}")"

            stop_container_safe
            remove_container_safe

            # Run container
            log "Starting container '${APP_NAME}' from '${CHOSEN_IMAGE}'..."
            docker run -d \
              --name "${APP_NAME}" \
              --network "${NET_NAME}" \
              --restart unless-stopped \
              -e NODE_ENV=production \
              -e PORT="${EXPOSE_PORT}" \
              -p ${EXPOSE_PORT}:${EXPOSE_PORT} \
              "${CHOSEN_IMAGE}"

            # Simple readiness probe (curl). If curl is not present, try logs.
            ATTEMPTS=20
            SLEEP_SEC=3
            READY=0

            if command -v curl >/dev/null 2>&1; then
              for i in $(seq 1 $ATTEMPTS); do
                if curl -fsS "http://127.0.0.1:${EXPOSE_PORT}/" >/dev/null 2>&1; then
                  READY=1
                  break
                fi
                log "Waiting for app to become ready... attempt $i/${ATTEMPTS}"
                sleep "${SLEEP_SEC}"
              done
            else
              # Fallback: short delay + check running state
              sleep 10
              if container_running; then READY=1; fi
            fi

            if [ "$READY" -ne 1 ]; then
              log "ERROR: App didn't become ready."
              docker logs "${APP_NAME}" || true
              exit 1
            fi

            log "Pruning dangling images..."
            docker image prune -f >/dev/null || true
            log "Deployment successful."
