name: build-and-push

on:
  push:
    branches:
      - master
      - "dev/**"
  workflow_dispatch:

env:
  IMAGE_NAME: projektzespolowy.splitpayment
  DOCKER_REPOSITORY: mehdev66/projektzespolowy.splitpayment
  DOCKERFILE_PATH: ./Dockerfile
  BUILD_CONTEXT: .
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.prepare.outputs.image_ref }}   # <-- to będzie użyte w deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (cache only for sanity check)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install deps (validate)
        run: npm ci
        env:
          CI: "true"

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REPOSITORY }}
          tags: |
            type=raw,value=${{ github.run_number }}_${{ env.IMAGE_NAME }}
            type=raw,value=latest_${{ env.IMAGE_NAME }}
            type=ref,event=branch
            type=sha

      # Przygotuj *niemutowalny* tag do propagation (ten będzie użyty w deploy)
      - name: Prepare immutable image ref
        id: prepare
        run: |
          echo "image_ref=${{ env.DOCKER_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          platforms: linux/amd64,linux/arm64
          # Pchamy zarówno “ładne” tagi z meta, jak i nasz niemutowalny tag z SHA
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.prepare.outputs.image_ref }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_TELEMETRY_DISABLED=${{ env.NEXT_TELEMETRY_DISABLED }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: development
      url: 3.71.231.81
    steps:
      - name: Deploy to Development VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST_SR01A }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -Eeuo pipefail

            IMAGE="${{ needs.build.outputs.image_ref }}"   # <-- dokładnie ten sam tag z build
            APP_NAME="ProjektZespolowy.SplitPayment.Frontend"
            NET_NAME="app-network"

            log() { echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] $*"; }

            ensure_network() {
              if ! docker network inspect "${NET_NAME}" >/dev/null 2>&1; then
                log "Network '${NET_NAME}' not found. Creating..."
                docker network create "${NET_NAME}"
              else
                log "Network '${NET_NAME}' exists."
              fi
            }

            container_running() { docker ps -q -f name="^/${APP_NAME}$" | grep -q .; }
            container_exists()  { docker ps -aq -f name="^/${APP_NAME}$" | grep -q .; }

            stop_container_safe() {
              if container_running; then
                log "Stopping running container '${APP_NAME}'..."
                docker stop "${APP_NAME}" >/dev/null
              else
                log "No running container '${APP_NAME}' to stop."
              fi
            }

            remove_container_safe() {
              if container_exists; then
                log "Removing existing container '${APP_NAME}'..."
                docker rm "${APP_NAME}" >/dev/null
              else
                log "No existing container '${APP_NAME}' to remove."
              fi
            }

            ensure_network

            log "Pulling image ${IMAGE}..."
            docker pull "${IMAGE}"

            stop_container_safe
            remove_container_safe

            docker run -d \
              --name "${APP_NAME}" \
              --network "${NET_NAME}" \
              --restart unless-stopped \
              -e NODE_ENV=development \
              -e PORT=3000 \
              -p 3000:3000 \
              "${IMAGE}"

            log "Waiting for container to stabilize..."
            sleep 10

            if container_running; then
              log "Container '${APP_NAME}' is running."
            else
              log "ERROR: Container '${APP_NAME}' failed to start."
              docker logs "${APP_NAME}" || true
              exit 1
            fi

            log "Pruning dangling images..."
            docker image prune -f >/dev/null || true
            log "Deployment successful!"
