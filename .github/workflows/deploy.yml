name: build-and-deploy

on:
  push:
    branches: [ master, "dev/**" ]
  workflow_dispatch:

env:
  IMAGE_NAME: projektzespolowy.splitpayment
  DOCKER_REPOSITORY: mehdev66/projektzespolowy.splitpayment
  DOCKERFILE_PATH: ./Dockerfile
  BUILD_CONTEXT: .
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ env.DOCKER_REPOSITORY }}:${{ github.sha }}
            ${{ env.DOCKER_REPOSITORY }}:latest
          # UWAGA: ten krok wystawia 'digest' w outputs (sha256:...)
          provenance: false

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      # Złóż pełny immutable image ref z digestem z joba 'build'
      IMAGE: ${{ env.DOCKER_REPOSITORY }}@${{ needs.build.outputs.digest }}
      APP_NAME: ProjektZespolowy.SplitPayment.Frontend
      NET_NAME: app-network
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -Eeuo pipefail
            log() { echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] $*"; }

            IMAGE="${IMAGE}"
            APP_NAME="${APP_NAME}"
            NET_NAME="${NET_NAME}"

            ensure_network() {
              if ! docker network inspect "${NET_NAME}" >/dev/null 2>&1; then
                log "Network '${NET_NAME}' not found. Creating..."
                docker network create "${NET_NAME}"
              else
                log "Network '${NET_NAME}' exists."
              fi
            }

            container_running() { docker ps -q -f name="^/${APP_NAME}$" | grep -q .; }
            container_exists()  { docker ps -aq -f name="^/${APP_NAME}$" | grep -q .; }

            stop_container_safe() {
              if container_running; then
                log "Stopping running container '${APP_NAME}'..."
                docker stop "${APP_NAME}" >/dev/null
              else
                log "No running container '${APP_NAME}' to stop."
              fi
            }

            remove_container_safe() {
              if container_exists; then
                log "Removing existing container '${APP_NAME}'..."
                docker rm "${APP_NAME}" >/dev/null
              else
                log "No existing container '${APP_NAME}' to remove."
              fi
            }

            ensure_network
            log "Pulling image ${IMAGE}..."
            docker pull "${IMAGE}"

            stop_container_safe
            remove_container_safe

            docker run -d \
              --name "${APP_NAME}" \
              --network "${NET_NAME}" \
              --restart unless-stopped \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -p 3000:3000 \
              "${IMAGE}"

            log "Waiting for container to stabilize..."
            sleep 10

            if container_running; then
              log "Container '${APP_NAME}' is running."
            else
              log "ERROR: Container '${APP_NAME}' failed to start."
              docker logs "${APP_NAME}" || true
              exit 1
            fi

            log "Pruning dangling images..."
            docker image prune -f >/dev/null || true
            log "Deployment successful!"
