name: build-and-deploy

on:
  push:
    branches: [ master, "dev/**" ]
  workflow_dispatch:

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker Hub repo
  DOCKER_REPOSITORY: mehdev66/projektzespolowy.splitpayment
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_repo: ${{ steps.meta.outputs.image_repo }}
      full_tag_sha: ${{ steps.meta.outputs.full_tag_sha }}
      full_tag_latest: ${{ steps.meta.outputs.full_tag_latest }}
      digest: ${{ steps.build_push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (optional)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          IMAGE_REPO="${DOCKER_REPOSITORY}"
          SHORT_SHA="${GITHUB_SHA::12}"

          REF_NAME="${GITHUB_REF_NAME}"
          BRANCH_SLUG="$(echo "$REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')"

          if [ "$REF_NAME" = "master" ]; then
            LATEST_TAG="latest"
          else
            LATEST_TAG="dev-${BRANCH_SLUG}"
          fi

          FULL_TAG_SHA="${IMAGE_REPO}:${SHORT_SHA}"
          FULL_TAG_LATEST="${IMAGE_REPO}:${LATEST_TAG}"

          {
            echo "image_repo=${IMAGE_REPO}"
            echo "short_sha=${SHORT_SHA}"
            echo "branch_slug=${BRANCH_SLUG}"
            echo "latest_tag=${LATEST_TAG}"
            echo "full_tag_sha=${FULL_TAG_SHA}"
            echo "full_tag_latest=${FULL_TAG_LATEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.full_tag_sha }}
            ${{ steps.meta.outputs.full_tag_latest }}
          provenance: false

      - name: Summary
        run: |
          echo "Repo:         ${{ steps.meta.outputs.image_repo }}"
          echo "Tag (SHA):    ${{ steps.meta.outputs.full_tag_sha }}"
          echo "Tag (latest): ${{ steps.meta.outputs.full_tag_latest }}"
          echo "Digest:       ${{ steps.build_push.outputs.digest }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      # Mapowanie na Twoje nazwy:
      # host z repo variables (VM_HOST_SR01A), user najpierw z secreta (VM_SSH_KEY_USER), fallback do variables (VM_USERNAME)
      DEPLOY_HOST: ${{ vars.VM_HOST_SR01A }}
      DEPLOY_USER: ${{ secrets.VM_SSH_KEY_USER || vars.VM_USERNAME }}
      DEPLOY_KEY:  ${{ secrets.VM_SSH_KEY }}
      DEPLOY_PORT: ${{ secrets.VM_SSH_PORT || 22 }}
    steps:
      - name: Preflight – validate SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          fail(){ echo "::error ::$1"; exit 1; }
          [ -n "${DEPLOY_HOST}" ] || fail "DEPLOY_HOST (vars.VM_HOST_SR01A) is empty"
          [ -n "${DEPLOY_USER}" ] || fail "DEPLOY_USER (secrets.VM_SSH_KEY_USER || vars.VM_USERNAME) is empty"
          [ -n "${DEPLOY_KEY}"  ] || fail "DEPLOY_KEY (secrets.VM_SSH_KEY) is empty"
          echo "SSH inputs OK"

      - name: Deploy over SSH (immutable by digest, fallback to tag)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key:      ${{ env.DEPLOY_KEY }}
          port:     ${{ env.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -Eeuo pipefail

            IMAGE_REPO="${{ needs.build.outputs.image_repo }}"
            DIGEST="${{ needs.build.outputs.digest }}"
            IMAGE_BY_DIGEST="${IMAGE_REPO}@${DIGEST}"
            IMAGE_BY_TAG="${{ needs.build.outputs.full_tag_sha }}"

            APP_NAME="ProjektZespolowy.SplitPayment.Frontend"
            NET_NAME="app-network"
            EXPOSE_PORT="3000"

            log() { echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] $*"; }
            container_running() { docker ps -q -f name="^/${APP_NAME}$" | grep -q .; }
            container_exists()  { docker ps -aq -f name="^/${APP_NAME}$" | grep -q .; }

            ensure_network() {
              if ! docker network inspect "${NET_NAME}" >/dev/null 2>&1; then
                log "Network '${NET_NAME}' not found. Creating..."
                docker network create "${NET_NAME}"
              else
                log "Network '${NET_NAME}' exists."
              fi
            }

            stop_container_safe() { container_running && docker.stop "${APP_NAME}" >/dev/null || true; } || true
            remove_container_safe(){ container_exists  && docker rm   "${APP_NAME}" >/dev/null || true; }

            pull_or_fallback() {
              local primary="$1" fallback="$2"
              log "Pulling image (by digest): ${primary}"
              if docker pull "${primary}"; then
                echo "${primary}"
                return
              fi
              log "WARN: Pull by digest failed. Falling back to tag: ${fallback}"
              docker pull "${fallback}"
              echo "${fallback}"
            }

            ensure_network
            CHOSEN_IMAGE="$(pull_or_fallback "${IMAGE_BY_DIGEST}" "${IMAGE_BY_TAG}")"

            # Stop/Remove jeśli istnieje
            if docker ps -q -f name="^/${APP_NAME}$" | grep -q .; then docker stop "${APP_NAME}" >/dev/null || true; fi
            if docker ps -aq -f name="^/${APP_NAME}$" | grep -q .; then docker rm   "${APP_NAME}" >/dev/null || true; fi

            log "Starting '${APP_NAME}' from '${CHOSEN_IMAGE}'..."
            docker run -d \
              --name "${APP_NAME}" \
              --network "${NET_NAME}" \
              --restart unless-stopped \
              -e NODE_ENV=production \
              -e PORT="${EXPOSE_PORT}" \
              -p ${EXPOSE_PORT}:${EXPOSE_PORT} \
              "${CHOSEN_IMAGE}"

            # Readiness probe
            if command -v curl >/dev/null 2>&1; then
              for i in {1..20}; do
                if curl -fsS "http://127.0.0.1:${EXPOSE_PORT}/" >/dev/null; then
                  log "App is ready."
                  break
                fi
                log "Waiting for app… ($i/20)"
                sleep 3
              done
            else
              sleep 10
            fi

            if ! docker ps -q -f name="^/${APP_NAME}$" | grep -q .; then
              log "ERROR: App failed to start."
              docker logs "${APP_NAME}" || true
              exit 1
            fi

            log "Pruning dangling images…"
            docker image prune -f >/dev/null || true
            log "Deployment successful."
