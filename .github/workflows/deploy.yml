name: build-and-push

on:
  push:
    branches:
      - master
      - "dev/**"
  workflow_dispatch:

env:
  IMAGE_NAME: projektzespolowy.splitpayment
  DOCKER_REPOSITORY: mehdev66/projektzespolowy.splitpayment
  DOCKERFILE_PATH: ./Dockerfile
  BUILD_CONTEXT: .
  NODE_VERSION: "20" # Next 14/15 działa stabilnie na Node 20
  NEXT_TELEMETRY_DISABLED: "1" # wyciszamy telemetry

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # (opcjonalnie) szybka walidacja zależności – nie budujemy lokalnie, tylko w Dockerze
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install deps (validate)
        run: npm ci
        env:
          CI: "true"

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REPOSITORY }}
          tags: |
            type=raw,value=${{ github.run_number }}_${{ env.IMAGE_NAME }}
            type=raw,value=latest_${{ env.IMAGE_NAME }}
            type=ref,event=branch
            type=sha

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_TELEMETRY_DISABLED=${{ env.NEXT_TELEMETRY_DISABLED }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
      runs-on: ubuntu-latest
      needs: [build]
      environment:
        name: development
        url: 3.71.231.81
      steps:
        - name: Deploy to Development VM
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ vars.VM_HOST_SR01A }}
            username: ${{ vars.VM_USERNAME }}
            key: ${{ secrets.VM_SSH_KEY }}
            script: |
              set -Eeuo pipefail
              IMAGE="${{ secrets.DCR_USERNAME }}/IMAGE_NAME"
              APP_NAME="wedding-dev"
              NET_NAME="app-network"
              log() { echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] $*"; }
              ensure_network() {
                if ! docker network inspect "${NET_NAME}" >/dev/null 2>&1; then
                  log "Network '${NET_NAME}' not found. Creating..."
                  docker network create "${NET_NAME}"
                else
                  log "Network '${NET_NAME}' exists."
                fi
              }
              container_running() { docker ps -q -f name="^/${APP_NAME}$" | grep -q .; }
              container_exists()  { docker ps -aq -f name="^/${APP_NAME}$" | grep -q .; }
              stop_container_safe() {
                if container_running; then
                  log "Stopping running container '${APP_NAME}'..."
                  docker stop "${APP_NAME}" >/dev/null
                else
                  log "No running container '${APP_NAME}' to stop."
                fi
              }
              remove_container_safe() {
                if container_exists; then
                  log "Removing existing container '${APP_NAME}'..."
                  docker rm "${APP_NAME}" >/dev/null
                else
                  log "No existing container '${APP_NAME}' to remove."
                fi
              }
              ensure_network
              log "Pulling image ${IMAGE}..."
              docker pull "${IMAGE}"
              stop_container_safe
              remove_container_safe
              docker run -d \
                --name "ProjektZespolowy.SplitPayment.Frontend" \
                --network "app-network" \
                --restart unless-stopped \
                -e NODE_ENV=development \
                -e PORT=3000 \
                "${IMAGE}"
              log "Waiting for container to stabilize..."
              sleep 10
              if container_running; then
                log "Container '${APP_NAME}' is running."
              else
                log "ERROR: Container '${APP_NAME}' failed to start."
                docker logs "${APP_NAME}" || true
                exit 1
              fi
              log "Pruning dangling images..."
              docker image prune -f >/dev/null || true
              log "Deployment successful!"
